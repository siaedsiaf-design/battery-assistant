workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Magic Fix - Rebuild Android Clean
        script: |
          # 1. مسح فولدر الأندرويد القديم اللي فيه المشاكل
          rm -rf android
          
          # 2. خلي الـ Flutter يعمل فولدر أندرويد جديد نضيف
          flutter create --platforms=android .
          
          # 3. نرجع نكتب ملف الـ MainActivity بالطريقة الصح
          mkdir -p android/app/src/main/kotlin/com/batteryassistant
          cat > android/app/src/main/kotlin/com/batteryassistant/MainActivity.kt << 'EOF'
          package com.batteryassistant.app
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity() {
          }
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
