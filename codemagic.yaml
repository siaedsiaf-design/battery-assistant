workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Clean up and Force V2 Embedding
        script: |
          # مسح أي أثر للملفات القديمة
          rm -rf android/app/src/main/kotlin
          # إعادة إنشاء مجلد الكوتلن الصح
          mkdir -p android/app/src/main/kotlin/com/batteryassistant
          cat > android/app/src/main/kotlin/com/batteryassistant/MainActivity.kt << 'EOF'
          package com.batteryassistant.app
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity() {
          }
          EOF
          # التعديل على ملف الـ gradle لإجباره على النظام الجديد
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
