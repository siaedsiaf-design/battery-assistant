name: battery_assistant
description: Premium Battery Health Tracker & Smart Assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  battery_plus: ^4.0.1
  flutter_local_notifications: ^16.3.0
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.2
  flutter_animate: ^4.5.0
  wakelock_plus: ^1.1.4
  permission_handler: ^11.3.0
  home_widget: ^0.4.1
  audioplayers: ^6.0.0
  vibration: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
